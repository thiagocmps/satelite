server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # a SPA precisa de history fallback; index.html nunca deve ser cacheado
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # PWA: manifest com content-type correto; sw.js nunca fica em cache (o
  # navegador precisa revalidar para pegar a proxima versao do app)
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # mesma origem para o navegador: a API e o frontend dividem host/porta
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # geração de resumo pode passar de 30s em modelos gratuitos
    proxy_read_timeout 90s;
  }

  location ~* \.(js|css|woff2?|svg|png|jpe?g|webp|avif|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
